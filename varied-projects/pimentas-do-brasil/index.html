<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pimentas do Brasil</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <!-- Splash intro -->
    <div id="splash" class="splash" aria-hidden="false">
      <!-- moving pepper (starts at title end, moves to final spot) -->
      <img class="splash-drop" src="images/pepper-logo.png" alt="Pimenta" aria-hidden="true">
      <div class="splash-inner">
        <!-- final pepper (revealed after move) -->
        <img class="splash-logo-alt" src="images/pepper-logo.png" alt="Pimenta final" aria-hidden="true">

        <div class="splash-text">
          <h1 class="splash-title">Pimentas do Brasil</h1>
        </div>
      </div>
    </div>

    <nav class="nav">
      <div class="logo">Pimentas do Brasil</div>
      <div class="nav-buttons">
        <button class="btn">Home</button>
        <button class="btn">Produtos</button>
        <button class="btn">Contato</button>
      </div>
    </nav>

    <header class="hero">
      <div class="overlay">
        <div class="hero-content">
          <h1>Pimentas do Brasil</h1>
          <p>Sabores e ardência das melhores pimentas do país.</p>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="controls">
        <div class="search">
          <label class="search-wrapper">
            <input id="searchInput" type="search" placeholder="Buscar por nome..." aria-label="Buscar pimenta" />
          </label>
          <button id="searchBtn" class="btn" title="Procurar">
            <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Buscar
          </button>
        </div>

        <div class="filters">
          <button id="filterBtn" class="btn small" title="Filtros" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M22 6H2l7 8v6l6-4v-2l7-8z" fill="currentColor"/>
            </svg>
            Filtro
          </button>

          <div class="filter-panel" id="filterPanel" aria-hidden="true">
            <div class="panel-row">
              <label class="panel-label">Ordenar</label>
              <select id="sortSelect">
                <option value="most_sold">Mais vendidas</option>
                <option value="least_sold">Menos vendidas</option>
                <option value="cheapest">Mais baratas</option>
                <option value="expensive">Mais caras</option>
                <option value="state">Por estado (A-Z)</option>
              </select>
            </div>
            <div class="panel-row">
              <label class="panel-label">Estado</label>
              <select id="stateSelect">
                <option value="all">Todos</option>
              </select>
            </div>
            <div class="panel-actions">
              <button id="applyFiltersBtn" class="btn small">Aplicar</button>
              <button id="closeFiltersBtn" class="btn small">Fechar</button>
            </div>
          </div>

          <button id="clearBtn" class="btn small" title="Limpar filtros">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 6h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 6v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6M9 6l1-2h4l1 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Limpar
          </button>
        </div>
      </section>

      <section id="peppers" class="grid">
        <!-- Cards serão renderizados aqui -->
      </section>
    </main>

    <footer class="footer">
      <p>© Pimentas do Brasil — Sabor com tradição.</p>
    </footer>

    <script src="scripts/script.js"></script>
  </body>
</html>
