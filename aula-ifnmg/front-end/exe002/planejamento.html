<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejamento</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>Planejamento da Viagem</h1>
</header>

<nav>
<a href="index.html">Início</a>
<a href="pontos.html">Pontos Turísticos</a>
</nav>

<div class="container">

<h2>Distâncias</h2>
<table>
<tr><th>Cidade</th><th>Distância</th></tr>
<tr><td>São Paulo</td><td>9400 km</td></tr>
<tr><td>Rio de Janeiro</td><td>9200 km</td></tr>
<tr><td>Belo Horizonte</td><td>9000 km</td></tr>
</table>

<h2>Formulário</h2>
<form>
<label>Nome Completo</label>
<input type="text">

<label>E-mail</label>
<input type="email">

<label>Idade</label>
<input type="number">

<label>Telefone</label>
<input type="tel">

<fieldset>
<legend>Sexo</legend>
<div class="inline">
<label><input type="radio" name="sexo"> Masculino</label>
<label><input type="radio" name="sexo"> Feminino</label>
<label><input type="radio" name="sexo"> Não binário</label>
<label><input type="radio" name="sexo"> Prefiro não dizer</label>
</div>
</fieldset>

<fieldset>
<legend>Motivos da viagem</legend>
<div class="inline">
<label><input type="checkbox"> Lazer</label>
<label><input type="checkbox"> Negócios</label>
<label><input type="checkbox"> Eventos</label>
<label><input type="checkbox"> Cursos</label>
</div>
</fieldset>

<label>Comentários</label>
<textarea></textarea>

<button type="submit">Enviar</button>
</form>

</div>

<footer>Planeje sua viagem com antecedência ✈️</footer>

</body>
</html>
